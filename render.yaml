# Render Blueprint for the staging backend and its managed Postgres database.
databases:
  - name: kamdhenu-db-staging
    # Free Render Postgres expires 30 days after creation with a 14-day grace
    # period before deletion; use a paid plan to keep staging data long-term.
    plan: free
    databaseName: kamdhenu_staging
    user: kamdhenu_staging
    region: singapore

services:
  - type: web
    name: kamdhenu-server-staging
    runtime: docker
    # Free web services spin down after about 15 minutes idle and cold-start
    # on the next request.
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    dockerCommand: npm run start:prod
    healthCheckPath: /api/health/ready
    # Change branch to a dedicated staging branch when one is introduced.
    branch: main
    autoDeploy: true
    envVars:
      # Render supplies the managed database connection string automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: kamdhenu-db-staging
          property: connectionString

      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://kamdhenu-admin-staging.onrender.com
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SUPABASE_STORAGE_BUCKET
        value: tds-files
      - key: SUPABASE_SIGNED_URL_TTL
        value: "3600"
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: ADMIN_SESSION_TTL_HOURS
        value: "12"

      # Enter these once in the Render dashboard; never commit their values.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_ALLOWLIST_EMAILS
        sync: false

  - type: web
    runtime: static
    name: kamdhenu-admin-staging
    branch: main
    autoDeploy: true
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Send every client-side route to Vite's entry point.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # These values are baked into the Vite build.
      - key: VITE_API_URL
        value: https://kamdhenu-server-staging.onrender.com
      # Google client IDs are public, but still supplied at deploy time here.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
